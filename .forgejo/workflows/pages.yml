name: Deploy demo to git-pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm run build

      - name: Prepare Pages content
        run: |
          rm -rf _pages
          mkdir -p _pages
          cp citeproc.mjs _pages/
          cp -r demo/* _pages/
          cp logo.svg _pages/

      - name: Deploy to Pages branch
        run: |
          cd _pages
          git init
          git config user.name "CI"
          git config user.email "ci@fiduswriter.org"
          git add -A
          git commit -m "Deploy demo [skip ci]"
          git push -f "https://${{ secrets.PAGES_TOKEN }}@git.fiduswriter.org/${{ github.repository }}.git" main:pages
